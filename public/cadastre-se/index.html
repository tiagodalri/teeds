<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cadastro</title>
<!--
  /cadastre-se (09/10/2026): o endereço que abre a plataforma direto na tela
  de CADASTRO, para os links de campanha ("clique aqui e faça seu cadastro").
  Antes o link caía na tela de entrar, e a pessoa tinha de achar o botão
  "Cadastre-se". O /cadastro é outra coisa: a landing de captação.

  Esta página só encaminha para a raiz com `?cadastro=1`, levando junto a
  marcação da campanha (utm), para a origem do cadastro continuar medida.
  Quem lê o `cadastro=1` é src/core/teeds/entradaInicial.ts.
-->
<meta http-equiv="refresh" content="0; url=/?cadastro=1">
<script>
  (function () {
    var q = new URLSearchParams(location.search)
    q.set('cadastro', '1')
    location.replace('/?' + q.toString() + location.hash)
  })()
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#8b9bb0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</head>
<body><p>Abrindo o cadastro…</p></body>
</html>
